<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Secret Animation</title>

<style>
    body {
        margin: 0;
        background: radial-gradient(circle at center, #0e0b25, #050210 70%);
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        user-select: none;
    }

    .message {
        position: absolute;
        font-size: 1.4rem;
        color: #ffffffcc;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 1.5s ease, transform 1.5s ease;
        pointer-events: none;
        text-shadow: 0 0 8px #fff;
    }

    .particle {
        position: absolute;
        border-radius: 50%;
        width: 8px;
        height: 8px;
        background: rgba(255, 255, 255, 0.8);
        pointer-events: none;
        animation: rise 2.2s linear forwards, fade 2.2s ease-out forwards;
    }

    @keyframes rise {
        from { transform: translateY(0); }
        to { transform: translateY(-140px); }
    }

    @keyframes fade {
        from { opacity: 1; }
        to { opacity: 0; }
    }
</style>
</head>

<body>

<script>
    const hiddenLines = [
        "A whisper rises in the dark.",
        "A spark drifts into the quiet.",
        "Shadows bloom with soft light.",
        "Every touch awakens something.",
        "The night remembers your name."
    ];

    let index = 0;

    function spawn(x, y) {
        createMessage(x, y);
        for (let i = 0; i < 12; i++) {
            createParticle(x, y);
        }
    }

    function createMessage(x, y) {
        const msg = document.createElement("div");
        msg.className = "message";
        msg.textContent = hiddenLines[index];

        index++;
        if (index >= hiddenLines.length) index = 0;

        msg.style.left = x - 40 + "px";
        msg.style.top = y - 10 + "px";

        document.body.appendChild(msg);

        requestAnimationFrame(() => {
            msg.style.opacity = 1;
            msg.style.transform = "translateY(-30px)";
        });

        setTimeout(() => msg.remove(), 3000);
    }

    function createParticle(x, y) {
        const p = document.createElement("div");
        p.className = "particle";

        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 30;

        p.style.left = x + Math.cos(angle) * radius + "px";
        p.style.top = y + Math.sin(angle) * radius + "px";

        document.body.appendChild(p);

        setTimeout(() => p.remove(), 2300);
    }

    document.addEventListener("click", e => {
        spawn(e.clientX, e.clientY);
    });
</script>

</body>
</html>
